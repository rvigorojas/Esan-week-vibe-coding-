services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pce
      POSTGRES_PASSWORD: pce
      POSTGRES_DB: pce
    ports:
      - "5432:5432"
    volumes:
      - pce_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pce -d pce"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pce:pce@db:5432/pce
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pce_db_data:
